name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC (09:00 KST)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#AB0640&color_dots=#ebedf0,#f2c4cf,#d97a93,#c03a5c,#AB0640
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5c8a&color_dots=#161b22,#4a1526,#7a1f3a,#b0294f,#ff5c8a

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
